<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <!-- Background -->
  <rect width="1200" height="630" fill="#2D2D31"/>

  <!-- Arch mark — brand book Q-curve paths, centered, scale(2) -->
  <!-- translate(490, 80): centers 110-unit-wide mark at x=600; arch bottom lands at y=320 -->
  <g transform="translate(490, 80) scale(2)">
    <!-- Arch walls in snow -->
    <path
      d="M 15 120 L 15 65 Q 15 12, 55 12 Q 95 12, 95 65 L 95 120 L 78 120 L 78 65 Q 78 28, 55 28 Q 32 28, 32 65 L 32 120 Z"
      fill="#FAF7F1"
    />
    <!-- Datum keystone -->
    <path d="M 44 28 L 66 28 L 72 52 L 38 52 Z" fill="#6667AB"/>
    <!-- Crossbar — snow bridge in hollow (the A reading) -->
    <rect x="32" y="78" width="46" height="7" fill="#FAF7F1"/>
  </g>

  <!-- Wordmark -->
  <text
    x="600"
    y="410"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="58"
    font-weight="400"
    letter-spacing="-2"
    fill="#FAF7F1"
  >Aedifica</text>

  <!-- Tagline -->
  <text
    x="600"
    y="454"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="18"
    letter-spacing="1"
    fill="#FAF7F1"
    opacity="0.48"
  >Construction-Management Workforce Pathways · New Jersey</text>

  <!-- Datum accent line -->
  <rect x="80" y="514" width="1040" height="1" fill="#6667AB" opacity="0.55"/>

  <!-- Domain -->
  <text
    x="600"
    y="549"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    letter-spacing="4"
    fill="#FAF7F1"
    opacity="0.28"
  >EDFCA.COM</text>

</svg>
